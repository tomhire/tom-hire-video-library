<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Admin Password - Tom Hire</title>
    <style>
        body {
            background: #101014;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: #1c1c24;
            padding: 30px;
            border-radius: 12px;
            width: 85%;
            max-width: 380px;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border-radius: 7px;
            border: 1px solid #444;
        }
        button {
            background: #7655e8;
            color: white;
            cursor: pointer;
            border: 0;
        }
        #message { margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Reset Admin Password</h2>
        <p>Enter your new password below.</p>

        <form id="resetForm">
            <input id="password" type="password"
                placeholder="New password" minlength="8" required>
            <input id="confirmPassword" type="password"
                placeholder="Confirm new password" minlength="8" required>
            <button type="submit">Update Password</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const SUPABASE_URL = "https://dltvqgejdntigbmyhqfr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_dyJQtPSVdfLiUN9GTjmZqQ_akWa1G4c";

        const params = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = params.get("access_token");
        const recoveryType = params.get("type");
        const message = document.getElementById("message");

        if (!accessToken || recoveryType !== "recovery") {
            message.textContent = "Invalid or expired reset link. Request a new one.";
            document.getElementById("resetForm").style.display = "none";
        }

        document.getElementById("resetForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            message.textContent = "Updating password...";

            try {
                const response = await fetch(SUPABASE_URL + "/auth/v1/user", {
                    method: "PUT",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + accessToken,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ password: password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.msg || "Password update failed.");
                }

                message.textContent = "Password updated successfully! You can now login.";
                document.getElementById("resetForm").style.display = "none";
            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
