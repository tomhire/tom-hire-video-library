<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom Hire Video Library</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      padding: 20px;
    }

    .video-card {
      display: block;
      overflow: hidden;
      border-radius: 12px;
      background: #171717;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .video-card:hover {
      transform: translateY(-4px);
    }

    .thumbnail-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #222;
    }

    .thumbnail-container img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-info {
      padding: 15px;
    }

    .video-title {
      font-size: 18px;
      font-weight: bold;
      color: white;
      text-decoration: none;
    }

    .video-desc {
      color: #ccc;
      margin-top: 8px;
    }

    .video-meta {
      color: #999;
      font-size: 13px;
      margin-top: 10px;
    }

    .hero-section {
      text-align: center;
      padding: 35px 15px;
    }

    .search-bar input {
      max-width: 450px;
      width: 90%;
      padding: 12px;
      margin-top: 20px;
      border-radius: 8px;
    }

    .image-error {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      color: white;
      background: #252525;
    }
  </style>
</head>

<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        Tom Hire <span>Video Library</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="admin.html">Admin Dashboard</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero-section">
      <h1>Tom Hire Video Library</h1>
      <p>Explore the video collection.</p>

      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Search videos..."
        >
      </div>
    </section>

    <section>
      <div id="videoGrid" class="video-grid">
        <p>Loading videos...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Tom Hire Video Library. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>

  <script>
    const grid = document.getElementById("videoGrid");
    const searchInput = document.getElementById("searchInput");

    let allVideos = [];

    function renderGallery(filter = "") {
      grid.replaceChildren();

      const filtered = allVideos.filter(video => {
        const title = (video.title || "").toLowerCase();
        const description = (video.description || "").toLowerCase();
        const search = filter.toLowerCase();

        return title.includes(search) || description.includes(search);
      });

      if (filtered.length === 0) {
        const message = document.createElement("p");
        message.textContent = "No videos found.";
        grid.appendChild(message);
        return;
      }

      filtered.forEach(video => {
        const card = document.createElement("a");
        card.className = "video-card";
        card.href = "watch.html?id=" + encodeURIComponent(video.id);

        const thumbnailContainer = document.createElement("div");
        thumbnailContainer.className = "thumbnail-container";

        const img = document.createElement("img");
        img.alt = video.title || "Video thumbnail";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";

        if (video.thumbnail) {
          img.src = video.thumbnail;
        } else {
          img.style.display = "none";
        }

        img.onerror = function () {
          const placeholder = document.createElement("div");
          placeholder.className = "image-error";
          placeholder.textContent = "Thumbnail unavailable";
          thumbnailContainer.replaceChildren(placeholder);
        };

        if (video.thumbnail) {
          thumbnailContainer.appendChild(img);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "image-error";
          placeholder.textContent = "No thumbnail";
          thumbnailContainer.appendChild(placeholder);
        }

        const info = document.createElement("div");
        info.className = "video-info";

        const title = document.createElement("div");
        title.className = "video-title";
        title.textContent = video.title || "Untitled video";

        const description = document.createElement("p");
        description.className = "video-desc";
        description.textContent = video.description || "";

        const date = document.createElement("div");
        date.className = "video-meta";
        date.textContent = video.publish_date
          ? "Published: " + video.publish_date
          : "";

        info.append(title, description, date);
        card.append(thumbnailContainer, info);
        grid.appendChild(card);
      });
    }

    async function loadVideos() {
      try {
        allVideos = await getVideos();

        allVideos.sort((a, b) =>
          new Date(b.publish_date || 0) -
          new Date(a.publish_date || 0)
        );

        console.log("Loaded videos:", allVideos);
        console.log(
          "Thumbnail URLs:",
          allVideos.map(video => video.thumbnail)
        );

        renderGallery();

      } catch (error) {
        console.error("Video loading error:", error);
        grid.textContent = "Could not load videos. Please refresh.";
      }
    }

    searchInput.addEventListener("input", () => {
      renderGallery(searchInput.value);
    });

    loadVideos();
  </script>

</body>
</html>
