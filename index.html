<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Hire Video Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Tom Hire <span>Video Library</span></a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="admin.html" class="admin-badge">Admin Dashboard</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <h1>Curated Video Collection</h1>
            <p>Explore exclusive video releases by Tom Hire.</p>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search videos by title or description...">
            </div>
        </section>

        <section>
            <div id="videoGrid" class="video-grid">
                <p>Loading videos...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tom Hire Video Library. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        const grid = document.getElementById("videoGrid");
        const searchInput = document.getElementById("searchInput");
        let allVideos = [];

        function renderGallery(filter = "") {
            grid.replaceChildren();

            const filtered = allVideos.filter(video =>
                (video.title || "").toLowerCase().includes(filter.toLowerCase()) ||
                (video.description || "").toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                const message = document.createElement("p");
                message.textContent = "No videos found.";
                grid.appendChild(message);
                return;
            }

            filtered.forEach(video => {
                const card = document.createElement("div");
                card.className = "video-card";

                const thumbnailContainer = document.createElement("div");
                thumbnailContainer.className = "thumbnail-container";

                const link = document.createElement("a");
                link.href = "watch.html?id=" + encodeURIComponent(video.id);

                const img = document.createElement("img");
                img.src = video.thumbnail || "";
                img.alt = video.title || "Video thumbnail";
                img.loading = "lazy";

                link.appendChild(img);
                thumbnailContainer.appendChild(link);

                const info = document.createElement("div");
                info.className = "video-info";

                const title = document.createElement("a");
                title.className = "video-title";
                title.href = link.href;
                title.textContent = video.title || "Untitled video";

                const description = document.createElement("p");
                description.className = "video-desc";
                description.textContent = video.description || "";

                const date = document.createElement("div");
                date.className = "video-meta";
                date.textContent = "Published: " + (video.publish_date || "");

                info.append(title, description, date);
                card.append(thumbnailContainer, info);
                grid.appendChild(card);
            });
        }

        async function loadVideos() {
            try {
                allVideos = await getVideos();
                allVideos.sort((a, b) =>
                    new Date(b.publish_date || 0) - new Date(a.publish_date || 0)
                );
                renderGallery();
            } catch (error) {
                console.error(error);
                grid.textContent = "Could not load videos. Please refresh the page.";
            }
        }

        searchInput.addEventListener("input", () => {
            renderGallery(searchInput.value);
        });

        loadVideos();
    </script>
</body>
</html>
