<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video - Tom Hire Video Library</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .watch-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .watch-title { margin-top: 24px; }
    .watch-description { line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">Tom Hire <span>Video Library</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="admin.html">Admin Dashboard</a></li>
      </ul>
    </div>
  </header>

  <main class="watch-container">
    <div id="videoPlayer" class="player">
      <p style="color:white;padding:20px;">Loading video...</p>
    </div>
    <h1 id="videoTitle" class="watch-title">Loading...</h1>
    <p id="videoDescription" class="watch-description"></p>
    <p id="videoDate"></p>
    <p><a href="index.html">← Back to videos</a></p>
  </main>

  <script src="app.js"></script>
  <script>
    async function loadVideo() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const player = document.getElementById("videoPlayer");

      if (!id) {
        player.textContent = "Video ID missing.";
        return;
      }

      try {
        const videos = await getVideos();
        const video = videos.find(item => String(item.id) === String(id));

        if (!video) {
          player.textContent = "Video not found.";
          return;
        }

        document.getElementById("videoTitle").textContent = video.title || "";
        document.getElementById("videoDescription").textContent = video.description || "";
        document.getElementById("videoDate").textContent = video.publish_date || "";

        const videoUrl = new URL(video.video_url);
        if (videoUrl.hostname !== "viddler.com" &&
            !videoUrl.hostname.endsWith(".viddler.com")) {
          player.textContent = "Invalid video URL.";
          return;
        }

        const iframe = document.createElement("iframe");
        iframe.src = videoUrl.href;
        iframe.title = video.title || "Video player";
        iframe.allow = "autoplay; fullscreen; picture-in-picture";
        iframe.allowFullscreen = true;
        player.replaceChildren(iframe);
      } catch (error) {
        console.error(error);
        player.textContent = "Could not load video. Please refresh.";
      }
    }

    loadVideo();
  </script>
</body>
</html>
